  $('#cal').innerHTML=(best<0?'<p class="muted sm" style="margin:0 0 12px">No sales in the last 5 weeks.</p>':`<div class="fsum"><span class="chip up">Busiest: ${DOW[best]}</span><span class="muted sm">averages ${av[best].toFixed(av[best]<10?1:0)} sold</span></div>`)
  +`<div class="calg"><span></span>${DOW.map((d,i)=>`<span class="wh ${i===best?'pk2':''}">${d}</span>`).join('')}`
  +[0,1,2,3,4].map(w=>`<span class="wl">${new Date(st+w*7*864e5).toLocaleDateString(undefined,{month:'short',day:'numeric',timeZone:'UTC'})}</span>`
    +cells.slice(w*7,w*7+7).map((c,j)=>{const p=c.v?Math.round(14+c.v/mx*86):0;
      return `<div class="cd ${c.fut?'fut':c.v?'on'+(p>55?' hi':''):''} ${c.key===td?'tod':''}" style="--pc:${p}%;--i:${w*7+j}" title="${nice(c.key)}${c.fut?'':': '+int(c.v)+' sold'}">${c.fut||!c.v?'':cmp(c.v)}</div>`}).join('')).join('')
  +`</div><div class="cscale">Less ${[0,25,50,75,100].map(p=>`<i style="background:color-mix(in srgb,var(--acc) ${p}%,var(--panel))"></i>`).join('')} More</div>`;
}
function widgets(){
  if(!$('#tmap'))return;
  const k=JSON.stringify(ins&&ins.items&&[ins.items,ins.days,ins.calendar,ins.analysis.spark])||'none'; if(k===sig.w)return; sig.w=k;
  if(!ins||!ins.items){$('#tmap').innerHTML=NEEDS2;$('#cal').innerHTML=NEEDS2;return}
  const it=ins.items;
  const ds=ins.analysis.spark.map(s=>s.date);
  if(fc){const r=ds.map(d=>(ins.days[d]||{}).received||0),s=ds.map(d=>(ins.days[d]||{}).sold||0);fc.data.labels=ds.map(d=>d.slice(5));fc.data.datasets[0].data=r;fc.data.datasets[1].data=s.map(x=>-x);fc.data.datasets[2].data=r.map((x,i)=>x-s[i]);fc.update()}
  const tv=it.filter(p=>p.value>0).sort((a,b)=>b.value-a.value), tt=tv.slice(0,8).map(p=>({n:p.name,v:p.value,dead:!p.sold30})), rest=tv.slice(8), out=[];
  if(rest.length)tt.push({n:`${rest.length} others`,v:rest.reduce((s,p)=>s+p.value,0),dead:rest.every(p=>!p.sold30)});
  tm(tt,0,0,100,56,out);
  $('#tmap').innerHTML=out.length?`<div class="tmw">${out.map((b,i)=>`<div class="tb ${b.dead?'dead':''}" title="${esc(b.n)}: ${fmt(b.v)}${b.dead?' (no sales in 30 days)':''}" style="left:${b.x}%;top:${b.y/.56}%;width:${b.w}%;height:${b.h/.56}%;animation-delay:${i*50}ms"><b>${esc(b.n)}</b><span>${cmp(Math.round(b.v))}</span></div>`).join('')}</div><p class="muted tnote">Size = stock value at cost. Red = no sale in 30 days.</p>`:'<p class="muted sm">No stock value yet. Add cost prices and quantities.</p>';
  paintCal();
}
const load=()=>Promise.all([api('/dashboard'),api('/insights').catch(()=>ins)]);
async function dashboard(){
  const [d,i]=await load(); ins=i; sel=hov=dayIdx=dayPin=null; sig={}; CD=[];
  const kr=(i,l,ico,c)=>`<div class="kr s${i}" style="--c:${c}"><div class="ico">${ic(ico,22)}</div><div><span>${l}</span><div class="n" id="k${i}"></div></div></div>`;
  shell('Dashboard',`${d.totalProducts?'':'<div class="card rise" style="margin-bottom:16px">No products yet. <a href="#/products/new">Add your first product</a> to see your stock charts.</div>'}
  <div class="grid k3">
    <div class="card sq hov rise" style="--i:0"><h3>${ic('layers',18)}Inventory snapshot</h3><div class="kst">${kr(0,'Products','box','#6482ff')}${kr(1,'Units on hand','layers','#22c55e')}${kr(2,'Stock value at cost','wallet','#a78bfa')}${kr(3,'Low-stock items','alert','#f5a300')}</div></div>
    <div class="card sq hov rise" style="--i:1"><h3>${ic('bars',18)}Sales analysis, last 30 days</h3><div id="ana" class="sqb"></div></div>

  </div>
  <div class="grid c21">

      <div class="ch tall"><canvas id="c1"></canvas><div class="chart-empty" id="cemp" hidden>No stock movement history yet. Add a product or adjust stock to start the chart.</div></div></div>
    <div class="card rise" style="--i:4"><div class="pane" id="pieV"><h3>${ic('pulse',18)}Stock health <span class="live"><i></i>Live</span></h3>
      <div class="ch pie"><span class="orb"></span><canvas id="c2"></canvas><div class="ctr"><b id="cn"></b><span id="cl"></span></div></div>
      <div class="leg">${KEYS.map(([k,n,c],i)=>`<div class="lg" id="lg${i}" style="--c:${c}"><i class="dot" style="background:${c}"></i>${n}<div><b id="ln${i}"></b> <small class="muted" id="lp${i}"></small></div></div>`).join('')}</div></div>
      <div class="pane off" id="dayV"></div></div>
  </div>
  <div class="reveal" id="dwrap"><div><div class="card" id="det"></div></div></div>
  <div class="card collage rise mt" style="--i:5"><div class="chead"><h3>${ic('layers',18)}Inventory board <span class="live"><i></i>Live</span></h3></div>
    <div class="cl">
      <div class="ct a"><h3 class="cth">${ic('bars',16)}Top products by quantity<small>amber = low stock</small></h3><div id="top"></div></div>
      <div class="ct b"><h3 class="cth">${ic('alert',16)}Low-stock items</h3><div id="low"></div></div>
      <div class="ct c"><h3 class="cth">${ic('wallet',16)}Where your money is in stock</h3><div id="tmap" class="ctb"></div></div>
      <div class="ct d"><h3 class="cth">${ic('bars',16)}Sold vs restocked, last 30 days</h3><div class="ch"><canvas id="c4"></canvas></div></div>
      <div class="ct e"><h3 class="cth">${ic('grid',16)}Sales calendar, last 5 weeks</h3><div id="cal" class="ctb"></div></div>
    </div>
  </div>`,
  `<a class="btn" href="#/products/new">${ic('plus',18)}Add product</a>`);
  KEYS.forEach((_,i)=>{const e=$('#lg'+i);e.onclick=e.onmouseenter=()=>{hov=i;ctr();pick(i)};e.onmouseleave=()=>{hov=null;ctr()}});
  if(window.Chart){
    Chart.defaults.font.family="'Bricolage Grotesque',system-ui,sans-serif"; Chart.defaults.color=css('--mut');
    cc=new Chart($('#c1'),{type:'bar',plugins:[lastLine,hl],data:{labels:[],datasets:[{data:[],borderSkipped:false,borderWidth:1.5,borderRadius:3,barPercentage:.72,categoryPercentage:.9,backgroundColor:c=>col(c.dataIndex),borderColor:c=>col(c.dataIndex)}]},
      options:{responsive:true,maintainAspectRatio:false,animation:{duration:900,easing:'easeOutQuart'},interaction:{mode:'index',intersect:false},
        onHover:(e,a)=>{ if(dayPin!=null)return; e.native.target.style.cursor=a.length?'pointer':'default'; const i=a.length?a[0].index:null; if(i==null){if(dayIdx!=null)hideDay()}else if(i!==dayIdx)showDay(i)},
        onClick:(e,a)=>{ if(!a.length){dayPin=null;hideDay();return} const i=a[0].index; dayPin=dayPin===i?null:i; dayPin==null?hideDay():showDay(i)},
        plugins:{legend:{display:false},tooltip:{displayColors:false,callbacks:{title:i=>CD[i[0].dataIndex].d,label:x=>{const c=CD[x.dataIndex],z=c.c-c.o;return[`Open: ${int(c.o)}`,`Close: ${int(c.c)}`,`Change: ${z>0?'+':''}${int(z)}`]}}}},
        scales:{y:{beginAtZero:false,grace:'10%',grid:{color:css('--line')}},x:{grid:{display:false},ticks:{maxTicksLimit:8}}}}});
    pc=new Chart($('#c2'),{type:'doughnut',data:{labels:KEYS.map(k=>k[1]),datasets:[{data:[0,0,0],backgroundColor:KEYS.map(k=>k[2]),borderWidth:0,spacing:3,borderRadius:6,hoverOffset:12}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'70%',animation:{duration:1100,easing:'easeOutQuart'},plugins:{legend:{display:false},tooltip:{enabled:false}},
        onHover:(e,a)=>{e.native.target.style.cursor=a.length?'pointer':'default';const i=a.length?a[0].index:null;if(i!==hov){hov=i;ctr();if(i!=null)pick(i)}},
        onClick:(e,a)=>{if(a.length)pick(a[0].index)}}});
    mkCharts();charts.push(cc,pc,fc);
  }
  paint(d);
  timer=setInterval(async()=>{if(document.hidden)return;try{const[d,i]=await load();ins=i;paint(d)}catch(e){}},5000);
}


async function products(){
  const list=await api('/products'); let first=true;
  shell('Products','<div class="card rise"><input id="q" placeholder="Search by name or SKU" style="max-width:320px;margin-bottom:12px"><div id="tbl"></div></div>',`<a class="btn" href="#/products/new">${ic('plus',18)}Add product</a>`);
  const draw=()=>{ const q=$('#q').value.trim().toLowerCase(); const rows=list.filter(p=>!q||p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q));
    $('#tbl').innerHTML=rows.length?`<table><thead><tr><th>Name</th><th>SKU</th><th class="r">Quantity</th><th>Status</th><th class="r">Selling price</th><th></th></tr></thead><tbody>${rows.map((p,i)=>
      `<tr${first?` class="rise" style="--i:${Math.min(i,12)*.4}"`:''}><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td class="r">${p.quantity}</td><td>${status(p)}</td><td class="r">${fmt(p.selling_price)}</td>
      <td><div class="act"><button class="light" data-a="adj" data-id="${p.id}">Adjust stock</button><a class="btn light" href="#/products/${p.id}">Edit</a><button class="danger" data-a="del" data-id="${p.id}">Delete</button></div></td></tr>`).join('')}</tbody></table>`
      :`<p class="muted">${list.length?'No products match your search.':'No products yet. Add your first one.'}</p>`; first=false; };
  $('#q').oninput=draw; draw();
  $('#tbl').onclick=async e=>{ const b=e.target.closest('button'); if(!b) return; const p=list.find(x=>x.id==b.dataset.id);
    if(b.dataset.a==='adj') return adjust(p);
    if(confirm(`Delete "${p.name}"? This cannot be undone.`)){ try{ await api('/products/'+p.id,'DELETE'); toast('Product deleted'); route(); }catch(x){toast(x.message)} } };
}
function adjust(p){
  const d=$('#dlg');
  d.innerHTML=`<form id="af"><h3>Adjust stock: ${esc(p.name)}</h3><p class="muted" style="margin-top:0">Currently ${p.quantity} on hand</p>
  <label>Change in units (use a minus to remove)<input name="delta" type="number" step="1" required autofocus placeholder="-3 or 10"></label>
  <label>Note (optional)<input name="note" maxlength="200"></label><div class="err"></div>
  <div class="act"><button type="button" class="light" id="x">Cancel</button><button>Apply change</button></div></form>`;
  d.showModal(); $('#x').onclick=()=>d.close();
  bindForm('#af',async v=>{ await api(`/products/${p.id}/adjust`,'POST',v); d.close(); toast('Stock updated'); route(); });
}
async function form(id){
  const p=id?await api('/products/'+id):{};
  shell(id?'Edit product':'New product',`<form id="pf" class="card rise" style="max-width:720px">
  <div class="f2"><label>Name<input name="name" required maxlength="120" value="${esc(p.name)}"></label><label>SKU<input name="sku" required maxlength="60" value="${esc(p.sku)}"></label></div>
  <label>Description<textarea name="description" rows="2" maxlength="500">${esc(p.description)}</textarea></label>
  <div class="f2"><label>Quantity on hand<input name="quantity" type="number" min="0" step="1" value="${p.quantity??0}"></label>
  <label>Low-stock threshold<input name="low_stock_threshold" type="number" min="0" step="1" value="${p.low_stock_threshold??''}" placeholder="Leave empty to use the default"></label>
  <label>Cost price<input name="cost_price" type="number" min="0" step="0.01" value="${p.cost_price??''}"></label>
  <label>Selling price<input name="selling_price" type="number" min="0" step="0.01" value="${p.selling_price??''}"></label></div>
  <div class="err"></div><button>Save product</button> <a class="btn light" href="#/products">Cancel</a>
  ${p.last_updated_by?`<p class="muted" style="font-size:13px">Last updated by ${esc(p.last_updated_by)} on ${esc(p.updated_at)} UTC</p>`:''}</form>`);
  bindForm('#pf',async v=>{ await api(id?'/products/'+id:'/products',id?'PUT':'POST',v); toast('Product saved'); location.hash='#/products'; });
}
async function settings(){
  const s=await api('/settings');
  shell('Settings',`<form id="sf" class="card rise" style="max-width:420px"><label>Default low-stock threshold<input name="default_threshold" type="number" min="0" step="1" required value="${s.default_threshold}"></label>
  <p class="muted" style="font-size:13px;margin-top:-6px">Applies to products that have no threshold of their own.</p><div class="err"></div><button>Save settings</button></form>`);
  bindForm('#sf',async v=>{ await api('/settings','PUT',v); toast('Settings saved'); });
}

async function route(){
  clearInterval(timer); charts.forEach(c=>c.destroy()); charts=[]; cc=pc=null;
  const h=location.hash.slice(1)||'/dashboard', pub=h==='/login'||h==='/signup';
  if(!user&&!pub) return void(location.hash='#/login');
  if(user&&pub) return void(location.hash='#/dashboard');
  try{
    if(pub) authView(h==='/signup');
    else if(h==='/dashboard') await dashboard();
    else if(h==='/products') await products();
    else if(h==='/products/new') await form();
    else if(h==='/settings') await settings();
    else if(/^\/products\/\d+$/.test(h)) await form(h.split('/')[2]);
    else location.hash='#/dashboard';
  }catch(x){ if(user) shell('Something went wrong',`<div class="card">${esc(x.message)}</div>`); }
}
addEventListener('hashchange',route);
(async()=>{ user=await api('/me').catch(()=>null); route(); })();
</script></body></html>
